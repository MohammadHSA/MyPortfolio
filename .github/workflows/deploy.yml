# ... top of file ...
jobs: 
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # Tell it where the lock file is
          cache-dependency-path: portfolio/package-lock.json 

      - name: Install dependencies
        # Tell it to run npm install INSIDE the portfolio folder
        run: npm install
        working-directory: portfolio

      - name: Build
        # Tell it to build INSIDE the portfolio folder
        run: npm run build
        working-directory: portfolio

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Tell it the finished site is in portfolio/dist
          path: './portfolio/dist' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
